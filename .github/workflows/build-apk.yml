name: Build SENSI.AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/sensi-ai-1.1.0
      - release/sensi-ai-2.0.0
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: sensi-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for engine tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run SENSI.AI offline engine tests
        run: node --test tests/engine.test.js tests/resolution-lab.test.js tests/boost-profiles.test.js

      - name: Verify frontend and Android assets are synchronized
        run: |
          cmp frontend/index.html app/src/main/assets/web/index.html
          cmp frontend/styles.css app/src/main/assets/web/styles.css
          cmp frontend/app.js app/src/main/assets/web/app.js
          cmp frontend/sensi-engine.js app/src/main/assets/web/sensi-engine.js
          cmp frontend/boost.js app/src/main/assets/web/boost.js
          cmp frontend/boost.css app/src/main/assets/web/boost.css
          cmp frontend/resolution-lab.js app/src/main/assets/web/resolution-lab.js
          cmp frontend/resolution-lab.css app/src/main/assets/web/resolution-lab.css
          cmp frontend/masterstrap-inspired.css app/src/main/assets/web/masterstrap-inspired.css
          cmp frontend/masterstrap-mobile.css app/src/main/assets/web/masterstrap-mobile.css
          cmp frontend/touch-effects.js app/src/main/assets/web/touch-effects.js

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Prepare permanent release keystore
        env:
          SENSI_KEYSTORE_BASE64: ${{ secrets.SENSI_KEYSTORE_BASE64 }}
        run: |
          test -n "$SENSI_KEYSTORE_BASE64" || { echo "Missing SENSI_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$SENSI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sensiai-release.jks"
          test -s "$RUNNER_TEMP/sensiai-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/sensiai-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Debug and Release APKs
        env:
          STORE_PASSWORD: ${{ secrets.SENSI_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SENSI_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SENSI_KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing SENSI_STORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SENSI_KEY_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SENSI_KEY_ALIAS repository secret"; exit 1; }
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APKs exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload SENSI.AI Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SENSI-AI-3.1.9-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SENSI.AI signed Release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SENSI-AI-3.1.9-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
