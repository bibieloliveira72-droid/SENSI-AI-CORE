name: Build SENSI.AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/sensi-ai-1.1.0
      - release/sensi-ai-2.0.0
      - hotfix/sensi-ai-2.0.1
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: sensi-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for engine tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run SENSI.AI offline engine tests
        run: node --test tests/engine.test.js

      - name: Verify frontend and Android assets are synchronized
        run: |
          cmp frontend/index.html app/src/main/assets/web/index.html
          cmp frontend/styles.css app/src/main/assets/web/styles.css
          cmp frontend/app.js app/src/main/assets/web/app.js
          cmp frontend/sensi-engine.js app/src/main/assets/web/sensi-engine.js
          cmp frontend/boost.js app/src/main/assets/web/boost.js
          cmp frontend/boost.css app/src/main/assets/web/boost.css

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release-key.jks"
          test -s "$GITHUB_WORKSPACE/release-key.jks"

      - name: Prepare debug keystore
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build signed Debug and signed Release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD repository secret"; exit 1; }
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK outputs and release signature
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SENSI-AI-2.0.1-RELEASE-SIGNED.apk

      - name: Calculate APK SHA-256
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/release/SENSI-AI-2.0.1-RELEASE-SIGNED.apk

      - name: Upload SENSI.AI Debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SENSI-AI-2.0.1-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload SENSI.AI signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: SENSI-AI-2.0.1-RELEASE-SIGNED
          path: app/build/outputs/apk/release/SENSI-AI-2.0.1-RELEASE-SIGNED.apk
          if-no-files-found: error
          retention-days: 14
