name: Build SENSI.AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - test/sensi-ai-1.1.0
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: sensi-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js for engine tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Run SENSI.AI offline engine tests
        run: node --test tests/engine.test.js

      - name: Verify frontend and Android assets are synchronized
        run: |
          cmp frontend/index.html app/src/main/assets/web/index.html
          cmp frontend/styles.css app/src/main/assets/web/styles.css
          cmp frontend/app.js app/src/main/assets/web/app.js
          cmp frontend/sensi-engine.js app/src/main/assets/web/sensi-engine.js

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Calculate APK SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload SENSI.AI APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SENSI-AI-1.2.0-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
