name: Build Voidstrap Mobile APK
on:
  push:
    branches: ["bootstrapper-mobile"]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Gradle 9.9.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.3"
      - name: Build Voidstrap Mobile debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload Voidstrap Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: Voidstrap-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error